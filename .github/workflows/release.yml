name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the GitHub Release
  packages: write          # push ghcr.io/hami9/shipyard
  id-token: write          # sign attestations (Sigstore OIDC)
  attestations: write      # store attestations
  artifact-metadata: write # artifact storage records

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint and test
        run: make lint test
      - name: Release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance for every archive
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
