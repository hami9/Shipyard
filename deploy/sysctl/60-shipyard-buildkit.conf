# Rootless BuildKit (ADR-0010) creates user namespaces as an unprivileged,
# unconfined process inside the builder container. Ubuntu 24.04 and later
# deny capabilities inside such namespaces by default, so builds fail until
# this restriction is lifted [UB-USERNS][BK-ROOTLESS]. The Shipyard units set
# RestrictNamespaces=yes to keep namespaces away from their own processes.
#
# Installs to /etc/sysctl.d/; apply with `sudo sysctl --system`. Only Ubuntu
# kernels have this key: elsewhere, skip this file.
kernel.apparmor_restrict_unprivileged_userns = 0
