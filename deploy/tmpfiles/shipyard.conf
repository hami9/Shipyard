# Caddy's admin directory (ADR-0003): the admin and verify sockets, reachable
# only by group shipyard-edge, which only shipyard-worker has. setgid, so the
# sockets Caddy creates inherit the group. It is recreated at every boot, and
# unlike a RuntimeDirectory it survives worker restarts, so Caddy's bind
# mount never goes stale [SYSTEMD-TMPFILES].
# Install to /etc/tmpfiles.d/shipyard.conf, then:
#   systemd-tmpfiles --create /etc/tmpfiles.d/shipyard.conf
d /run/shipyard       0755 root root          -
d /run/shipyard/caddy 2770 root shipyard-edge -
